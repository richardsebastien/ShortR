image: mcr.microsoft.com/playwright:v1.50.0-jammy

services:
  - name: mariadb:10.11
    alias: mysql

variables:
  MYSQL_HOST: mysql
  MYSQL_PORT: 3306
  MYSQL_USER: urlr
  MYSQL_PASSWORD: changeme
  MYSQL_DB: urlr
  MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
  PORT: 3000
  SESSION_SECRET: ci-session-secret-key-12345
  PUBLIC_BASE_URL: http://localhost:3000

stages:
  - deploy

pages:
  stage: deploy
  script:
    - apt-get update && apt-get install -y mariadb-client
    - mariadb -h mysql -u root -e "CREATE DATABASE IF NOT EXISTS urlr; CREATE USER IF NOT EXISTS 'urlr'@'%' IDENTIFIED BY 'changeme'; GRANT ALL PRIVILEGES ON urlr.* TO 'urlr'@'%'; FLUSH PRIVILEGES;"
    - mariadb -h mysql -u urlr -pchangeme urlr < sql/001_init.sql
    - mariadb -h mysql -u urlr -pchangeme urlr < sql/002_add_users.sql
    - mariadb -h mysql -u urlr -pchangeme urlr < sql/003_add_reset_tokens.sql
    - npm ci
    - npm run test:e2e
    - mkdir -p public_pages
    - cp -r playwright-report/* public_pages/
    - rm -rf public
    - mv public_pages public
  artifacts:
    paths:
      - public
    when: always
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
