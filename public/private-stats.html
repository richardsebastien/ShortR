<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ShortR | Stats du lien court</title>
  <link rel="stylesheet" href="/style.css" />
<link rel="stylesheet" href="/nav.css" />
  <style>
    .card { background:#0e1533;border:1px solid #2b3355;border-radius:12px;padding:16px;margin:12px 0; }
    .grid { display:grid; gap:12px; grid-template-columns: repeat(2,1fr); }
    .muted { opacity:.8; font-size:14px; }
    canvas { width:100%; max-width:800px; height:240px; }
    table { width:100%; border-collapse: collapse; }
    th, td { border-bottom:1px solid #2b3355; padding:8px; text-align:left; }
    .row { display:flex; gap:8px; align-items:center; }
    input[type=text]{ flex:1; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Stats du lien court</h1>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <style>
        .marker-cluster-small div, .marker-cluster-medium div, .marker-cluster-large div {
            background-color: rgba(4, 120, 87, 0.8);
        }
        .marker-cluster-small, .marker-cluster-medium, .marker-cluster-large {
            background-color: rgba(4, 120, 87, 0.5);
        }
    </style>
    <p id="error-msg" style="color: red;"></p>
    <div id="content" hidden>
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h2 id="h-code"></h2>
          <div id="export-buttons">
              <!-- Les boutons seront injectés ici -->
          </div>
        </div>
        <p><strong>Cible :</strong> <a id="h-target" class="link" target="_blank" rel="noopener"></a></p>
        <p class="muted">Créé le <span id="h-created"></span> · Actif : <span id="h-active"></span></p>
        <div class="grid">
          <div class="card">
            <h3>Total</h3>
            <p id="t-all" style="font-size:32px;font-weight:800;margin:0;"></p>
            <p class="muted">24h : <span id="t-24h"></span> · 7j : <span id="t-7d"></span> · 30j : <span id="t-30d"></span></p>
          </div>
          <div class="card">
            <h3>Chronologie (30j)</h3>
            <canvas id="chart"></canvas>
          </div>
        </div>
      </div>

      <div class="card">
        <h3>Top referrers</h3>
        <table id="tab-ref">
          <thead><tr><th>Referrer</th><th>Clicks</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>

      <div class="card">
        <h3>Top UTM</h3>
        <table id="tab-utm">
          <thead><tr><th>source</th><th>medium</th><th>campaign</th><th>Clicks</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>

      <div class="card">
        <h3>Derniers clics</h3>
        <table id="tab-recent">
          <thead><tr><th>Date/heure</th><th>Referrer</th><th>UTM</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>

      <div class="card">
        <h3>Carte des clics</h3>
        <div id="map" style="height: 400px; background-color: #1a202c; border-radius: 8px;"></div>
      </div>
    </div>
  </main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
    const $ = s => document.querySelector(s);
    const errorMsg = $('#error-msg');

    window.addEventListener('DOMContentLoaded', () => {
        if (window.location.hash) {
            const code = window.location.hash.substring(1);
            fetchAndRender(code);
        } else {
            errorMsg.textContent = 'Code de lien non spécifié.';
        }
    });

    async function fetchAndRender(code) {
      const r = await fetch('/api/stats-private/' + encodeURIComponent(code));
      if (r.status === 401) {
          errorMsg.textContent = 'Vous devez être connecté pour voir cette page.';
          setTimeout(() => window.location.href = '/login.html', 2000);
          return;
      }
      if (r.status === 403) {
          errorMsg.textContent = "Vous n'avez pas la permission de voir les statistiques de ce lien.";
          setTimeout(() => window.location.href = '/dashboard.html', 2000);
          return;
      }
      const data = await r.json();
      if (!r.ok || !data.ok) {
        errorMsg.textContent = data.error || 'Code introuvable';
        return;
      }

      $('#content').hidden = false;

      // En-tête
      $('#h-code').textContent = (data.url.title ? data.url.title + ' · ' : '') + code;

      // Boutons d'export
      const exportButtons = $('#export-buttons');
      exportButtons.innerHTML = `
          <a href="/api/stats-private/${code}/export/csv" class="button" download>Export CSV</a>
          <a href="/api/stats-private/${code}/export/xlsx" class="button" download>Export XLSX</a>
      `;
      $('#h-target').textContent = data.url.target;
      $('#h-target').href = data.url.target;
      $('#h-created').textContent = new Date(data.url.created_at).toLocaleString();
      $('#h-active').textContent = data.url.is_active ? 'oui' : 'non';

      // Totaux
      $('#t-all').textContent = data.totals.all;
      $('#t-24h').textContent = data.totals.last24h;
      $('#t-7d').textContent  = data.totals.last7d;
      $('#t-30d').textContent = data.totals.last30d;

      // Timeline simple au canvas (pas de lib externe)
      drawChart(data.timeline);

      // Referrers
      const refBody = $('#tab-ref tbody'); refBody.innerHTML = '';
      for (const {ref, c} of data.referrers) {
        const tr = document.createElement('tr');
        const tdR = document.createElement('td');
        const tdC = document.createElement('td');
        tdR.textContent = ref || '(direct)';
        tdC.textContent = c;
        tr.append(tdR, tdC);
        refBody.appendChild(tr);
      }

      // UTM
      const utmBody = $('#tab-utm tbody'); utmBody.innerHTML = '';
      for (const row of data.utm) {
        const tr = document.createElement('tr');
        const t1 = document.createElement('td'); t1.textContent = row.source || '—';
        const t2 = document.createElement('td'); t2.textContent = row.medium || '—';
        const t3 = document.createElement('td'); t3.textContent = row.campaign || '—';
        const t4 = document.createElement('td'); t4.textContent = row.c;
        tr.append(t1,t2,t3,t4);
        utmBody.appendChild(tr);
      }

      // Recent
      const recentBody = $('#tab-recent tbody'); recentBody.innerHTML = '';
      for (const rc of data.recent) {
        const tr = document.createElement('tr');
        const t1 = document.createElement('td'); t1.textContent = new Date(rc.ts).toLocaleString();
        const t2 = document.createElement('td'); t2.textContent = rc.referrer || '(direct)';
        const t3 = document.createElement('td'); t3.textContent =
          [rc.utm_source, rc.utm_medium, rc.utm_campaign].filter(Boolean).join(' · ') || '—';
        tr.append(t1,t2,t3);
        recentBody.appendChild(tr);
      }

      // Map
      renderMap(code);
    }

    async function renderMap(code) {
        const map = L.map('map').setView([20, 0], 2);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a class="link" href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a class="link" href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);

        const r = await fetch(`/api/stats-private/${code}/map`);
        if (!r.ok) return;
        const locations = await r.json();

        const markers = L.markerClusterGroup({
            iconCreateFunction: function(cluster) {
                const count = cluster.getChildCount();
                let size = 'small';
                if (count > 10) size = 'medium';
                if (count > 100) size = 'large';
                return L.divIcon({
                    html: `<div><span>${count}</span></div>`,
                    className: `marker-cluster marker-cluster-${size}`,
                    iconSize: L.point(40, 40)
                });
            }
        });

        for (const loc of locations) {
            if (loc.lat && loc.lon) {
                const marker = L.marker([loc.lat, loc.lon], {
                    title: `${loc.country_code} (${loc.count} clicks)`
                });
                markers.addLayer(marker);
            }
        }
        map.addLayer(markers);
    }

    function drawChart(timeline) {
      const el = document.getElementById('chart');
      const ctx = el.getContext('2d');
      ctx.clearRect(0,0,el.width,el.height);

      // Dimensions
      const W = el.width = el.clientWidth;
      const H = el.height = 240;

      // Normalise les 30 jours (remplit les jours manquants à 0)
      const map = new Map(timeline.map(x => [x.d.slice(0,10), x.c]));
      const days = [];
      for (let i=29;i>=0;i--) {
        const d = new Date(); d.setDate(d.getDate()-i);
        const k = d.toISOString().slice(0,10);
        days.push({ k, c: map.get(k) || 0 });
      }
      const max = Math.max(1, ...days.map(x => x.c));

      // Axes simples
      const pad = 24;
      const plotW = W - pad*2;
      const plotH = H - pad*2;
      ctx.strokeStyle = 'rgba(255,255,255,.3)';
      ctx.beginPath();
      ctx.moveTo(pad, H-pad);
      ctx.lineTo(W-pad, H-pad);
      ctx.moveTo(pad, pad);
      ctx.lineTo(pad, H-pad);
      ctx.stroke();

      // Barres
      const bw = plotW / days.length;
      for (let i=0;i<days.length;i++) {
        const x = pad + i*bw;
        const h = (days[i].c / max) * (plotH - 4);
        ctx.fillStyle = 'rgba(59,130,246,.9)';
        ctx.fillRect(x+1, H-pad-h, Math.max(1,bw-2), h);
      }

      // Labels grossiers: début / milieu / fin
      ctx.fillStyle = 'rgba(255,255,255,.75)';
      ctx.font = '12px system-ui';
      const labelIdx = [0, Math.floor(days.length/2), days.length-1];
      labelIdx.forEach(idx => {
        const d = days[idx].k.slice(5); // MM-DD
        const x = pad + idx*bw;
        ctx.fillText(d, x, H-6);
      });
    }
</script>
<script src="/nav.js"></script>
</body>
</html>
