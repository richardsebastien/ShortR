<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title data-translate="reset.title">Réinitialiser le mot de passe - ShortR</title>
<link rel="stylesheet" href="/style.css" />
<link rel="stylesheet" href="/nav.css" />
</head>
<body>
<main class="wrap">
    <h1 data-translate="reset.heading">Réinitialiser le mot de passe</h1>
    <form id="f">
        <label data-translate="reset.label.password">Nouveau mot de passe (8 caractères minimum)</label>
        <input id="password" type="password" required minlength="8" />
        <button style="margin-top: 16px;" data-translate="reset.button.reset">Réinitialiser le mot de passe</button>
    </form>
    <p id="error-msg" style="color: red;"></p>
</main>
<script>
const $ = s => document.querySelector(s);
const errorMsg = $('#error-msg');

// Get token from URL query string
const urlParams = new URLSearchParams(window.location.search);
const token = urlParams.get('token');

if (!token) {
    errorMsg.textContent = 'Token de réinitialisation manquant ou invalide. / Missing or invalid reset token.';
    $('#f').style.display = 'none';
}

$('#f').addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.textContent = '';

    const payload = {
        token: token,
        password: $('#password').value
    };
    const r = await fetch('/api/auth/reset-password', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    });
    const data = await r.json();
    if (!r.ok) {
        errorMsg.textContent = data.error || 'Erreur';
        return;
    }

    // Use getTranslation from translations.js if loaded, or a fallback message
    const successText = (typeof getTranslation === 'function')
        ? getTranslation('reset.success')
        : 'Mot de passe réinitialisé avec succès ! Vous pouvez maintenant vous connecter.';
    alert(successText);
    window.location.href = '/login.html';
});
</script>
<script src="/nav.js"></script>
</body>
</html>
