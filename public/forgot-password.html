<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title data-translate="forgot.title">Mot de passe oublié - ShortR</title>
<link rel="stylesheet" href="/style.css" />
<link rel="stylesheet" href="/nav.css" />
</head>
<body>
<main class="wrap">
    <h1 data-translate="forgot.heading">Mot de passe oublié</h1>
    <form id="f">
        <label data-translate="forgot.label.email">Email</label>
        <input id="email" type="email" required />
        <button style="margin-top: 16px;" data-translate="forgot.button.send">Envoyer le lien de réinitialisation</button>
    </form>
    <p id="error-msg" style="color: red;"></p>
    <div id="success-box" style="display: none; margin-top: 20px; padding: 15px; border: 1px solid green; background-color: rgba(0,128,0,0.1); border-radius: 4px;">
        <p id="success-msg" data-translate="forgot.success_message">Lien de réinitialisation généré avec succès ! Vous pouvez cliquer sur le lien ci-dessous pour réinitialiser votre mot de passe :</p>
        <p><a id="reset-link" class="link" href="#">Lien de réinitialisation</a></p>
    </div>
    <p><a class="link" href="/login.html" data-translate="forgot.back_to_login">Retour à la connexion</a></p>
</main>
<script>
const $ = s => document.querySelector(s);
const errorMsg = $('#error-msg');
const successBox = $('#success-box');
const resetLink = $('#reset-link');

$('#f').addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.textContent = '';
    successBox.style.display = 'none';

    const payload = {
        email: $('#email').value
    };
    const r = await fetch('/api/auth/forgot-password', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    });
    const data = await r.json();
    if (!r.ok) {
        errorMsg.textContent = data.error || 'Erreur';
        return;
    }

    // Show success and set the reset link href and text
    successBox.style.display = 'block';
    resetLink.href = data.resetLink;
    resetLink.textContent = data.resetLink;
});
</script>
<script src="/nav.js"></script>
</body>
</html>
