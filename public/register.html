<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title data-translate="register.title">Inscription - ShortR</title>
<link rel="stylesheet" href="/style.css" />
<link rel="stylesheet" href="/nav.css" />
</head>
<body>
<main class="wrap">
    <h1 data-translate="register.heading">Inscription</h1>
    <form id="f">
        <label data-translate="register.label.email">Email</label>
        <input id="email" type="email" required />
        <label data-translate="register.label.password">Mot de passe (8 caractères minimum)</label>
        <input id="password" type="password" required minlength="8" />
        <button style="margin-top: 16px;" data-translate="register.button.register">S'inscrire</button>
    </form>
    <p id="error-msg" style="color: red;"></p>
    <p><span data-translate="register.already_account">Déjà un compte ?</span> <a class="link" href="/login.html" data-translate="register.login_link">Connectez-vous</a>.</p>
</main>
<script>
const $ = s => document.querySelector(s);
const errorMsg = $('#error-msg');
$('#f').addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.textContent = '';
    const payload = {
        email: $('#email').value,
        password: $('#password').value
    };
    const r = await fetch('/api/auth/register', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    });
    const data = await r.json();
    if (!r.ok) {
        errorMsg.textContent = data.error || 'Erreur';
        return;
    }
    alert(getTranslation('register.success'));
    window.location.href = '/login.html';
});
</script>
<script src="/nav.js"></script>
</body>
</html>
