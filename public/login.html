<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title data-translate="login.title">Connexion - ShortR</title>
<link rel="stylesheet" href="/style.css" />
<link rel="stylesheet" href="/nav.css" />
</head>
<body>
<main class="wrap">
    <h1 data-translate="login.heading">Connexion</h1>
    <form id="f">
        <label data-translate="login.label.email">Email</label>
        <input id="email" type="email" required />
        <label data-translate="login.label.password">Mot de passe</label>
        <input id="password" type="password" required />
        <button style="margin-top: 16px;" data-translate="login.button.login">Se connecter</button>
    </form>
    <p id="error-msg" style="color: red;"></p>
    <p><a class="link" href="/forgot-password.html" data-translate="login.forgot_link">Mot de passe oublié ?</a></p>
    <p><span data-translate="login.no_account">Pas encore de compte ?</span> <a class="link" href="/register.html" data-translate="login.register_link">Inscrivez-vous</a>.</p>
</main>
<script>
const $ = s => document.querySelector(s);
const errorMsg = $('#error-msg');
$('#f').addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.textContent = '';
    const payload = {
        email: $('#email').value,
        password: $('#password').value
    };
    const r = await fetch('/api/auth/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
        body: JSON.stringify(payload)
    });
    const data = await r.json();
    if (!r.ok) {
        errorMsg.textContent = data.error || 'Erreur';
        return;
    }
    window.location.href = '/dashboard.html';
});
</script>
<script src="/nav.js"></script>
</body>
</html>
