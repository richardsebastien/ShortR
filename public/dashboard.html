<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tableau de bord - ShortR</title>
    <link rel="stylesheet" href="/style.css" />
<link rel="stylesheet" href="/nav.css" />
    <style>
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #2b3355; padding: 8px 12px; text-align: left; }
        th { background-color: #0e1533; }
    </style>
</head>
<body>
<main class="wrap">
    <h1>Tableau de bord</h1>
    <p>Voici la liste de vos liens raccourcis.</p>
    <table id="links-table">
        <thead>
            <tr>
                <th>Lien court</th>
                <th>Cible</th>
                <th>Titre</th>
                <th>Créé le</th>
                <th>Stats</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <!-- Les lignes seront insérées ici par le script -->
        </tbody>
    </table>
</main>
<script>
    const $ = s => document.querySelector(s);

    async function fetchLinks() {
        const r = await fetch('/api/user/links', { credentials: 'same-origin' });
        if (r.status === 401) {
            window.location.href = '/login.html';
            return;
        }
        const links = await r.json();
        const tbody = $('#links-table tbody');
        tbody.innerHTML = '';
        links.forEach(link => {
            const row = tbody.insertRow();
            row.dataset.code = link.code;
            row.innerHTML = `
                <td><a class="link" href="/${link.code}" target="_blank">${link.code}</a></td>
                <td>${link.target}</td>
                <td>${link.title || ''}</td>
                <td>${new Date(link.created_at).toLocaleString()}</td>
                <td><a class="link" href="/private-stats.html#${link.code}">Voir</a></td>
                <td>
                    <button class="action-btn edit-btn">Modifier</button>
                    <button class="action-btn delete-btn">Supprimer</button>
                </td>
            `;
        });
    }

    $('#links-table').addEventListener('click', async (e) => {
        const target = e.target;
        if (target.classList.contains('action-btn')) {
            const row = target.closest('tr');
            const code = row.dataset.code;

            if (target.classList.contains('delete-btn')) {
                if (confirm(`Voulez-vous vraiment supprimer le lien ${code} ?`)) {
                    const res = await fetch(`/api/links/${code}`, { method: 'DELETE' });
                    if (res.ok) {
                        row.remove();
                    } else {
                        const { error } = await res.json();
                        alert(`Erreur: ${error}`);
                    }
                }
            } else if (target.classList.contains('edit-btn')) {
                const newCode = prompt(`Entrez le nouveau code pour ${code}:`, code);
                if (newCode && newCode !== code) {
                    const res = await fetch(`/api/links/${code}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ newCode })
                    });
                    const data = await res.json();
                    if (res.ok) {
                        // Refresh the list to show the new code
                        fetchLinks();
                    } else {
                        alert(`Erreur: ${data.error}`);
                    }
                }
            }
        }
    });

    fetchLinks();
</script>
<script src="/nav.js"></script>
</body>
</html>
