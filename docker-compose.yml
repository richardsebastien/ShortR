services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: urlr
      MYSQL_USER: urlr
      MYSQL_PASSWORD: changeme
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro

  app:
    image: node:20
    working_dir: /app
    command: bash -lc "npm ci || npm i && npm run dev"
    volumes:
      - ./:/app
    environment:
      PORT: "3000"
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_USER: urlr
      MYSQL_PASSWORD: changeme
      MYSQL_DB: urlr
      ADMIN_TOKEN: change-this-admin-token
      PUBLIC_BASE_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - db

volumes:
  dbdata:
